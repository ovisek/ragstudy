[study]
name = "lightrag-vs-graphrag-thesis"
seed = 20260722
output_root = "results"
data_root = "data"
protocol_version = "1.0"

[common]
chunk_tokens = 600
chunk_overlap_tokens = 100
top_k = 5
temperature = 0.0
answer_prompt = "Answer only from the supplied context. If the context is insufficient, say so clearly. Cite source chunk identifiers in square brackets when possible."

[provider]
# Set the exact dated model IDs before `init`; do not use an unpinned alias.
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
generator_model = "SET_EXACT_MODEL_ID"
embedding_model = "SET_EXACT_EMBEDDING_MODEL_ID"
judge_model = "SET_EXACT_JUDGE_MODEL_ID"
region = "SET_REGION"
pricing_date = "YYYY-MM-DD"
# USD per one million tokens. These are intentionally blank until the study's
# provider/model/price snapshot is selected and saved.
generator_input_per_million = 0.0
generator_output_per_million = 0.0
embedding_input_per_million = 0.0
judge_input_per_million = 0.0
judge_output_per_million = 0.0

[datasets.ultradomain_agriculture]
family = "ultradomain"
domain = "agriculture"
sample_size = 300
pilot_size = 20
source_url = "https://huggingface.co/datasets/TommyChien/UltraDomain"
licence = "Apache-2.0"

[datasets.ultradomain_legal]
family = "ultradomain"
domain = "legal"
sample_size = 300
pilot_size = 20
source_url = "https://huggingface.co/datasets/TommyChien/UltraDomain"
licence = "Apache-2.0"

[datasets.graphrag_bench_medical]
family = "graphrag_bench"
domain = "medical"
sample_size = 300
pilot_size = 20
source_url = "https://huggingface.co/datasets/GraphRAG-Bench/GraphRAG-Bench"
licence = "record during acquisition"

[datasets.graphrag_bench_novel]
family = "graphrag_bench"
domain = "novel"
sample_size = 300
pilot_size = 20
source_url = "https://huggingface.co/datasets/GraphRAG-Bench/GraphRAG-Bench"
licence = "record during acquisition"

[datasets.hotpotqa_fullwiki]
family = "hotpotqa"
domain = "fullwiki_validation"
sample_size = 300
pilot_size = 20
source_url = "https://huggingface.co/datasets/hotpotqa/hotpot_qa"
licence = "CC-BY-SA-4.0"

[datasets.kevin_scott_podcasts]
family = "kevin_scott"
domain = "global_sensemaking"
sample_size = 125
pilot_size = 20
source_url = "https://github.com/microsoft/graphrag-benchmarking-datasets"
licence = "CDLA-Permissive-2.0"
use_all_questions = true

[systems.naive]
kind = "native"

[systems.graphrag]
kind = "command"
# Requires the pinned `systems` extra; see scripts/graphrag_bridge.py.
index_command = ".venv/bin/python scripts/graphrag_bridge.py index --config config/experiment.toml --workspace {workspace} --input {input} --output {output}"
query_command = ".venv/bin/python scripts/graphrag_bridge.py query --config config/experiment.toml --workspace {workspace} --question {question} --method {method} --output {output}"

[systems.lightrag]
kind = "command"
# Requires the pinned `systems` extra; see scripts/lightrag_bridge.py.
index_command = ".venv/bin/python scripts/lightrag_bridge.py index --config config/experiment.toml --workspace {workspace} --input {input} --output {output}"
query_command = ".venv/bin/python scripts/lightrag_bridge.py query --config config/experiment.toml --workspace {workspace} --question {question} --method {method} --output {output}"
