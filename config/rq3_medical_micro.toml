[study]
name = "lightrag-vs-graphrag-rq3-medical-micro"
seed = 20260722
output_root = "results"
data_root = "data"
protocol_version = "1.0-rq3-micro"

[common]
chunk_tokens = 600
chunk_overlap_tokens = 100
concurrent_workers = 16
top_k = 5
temperature = 0.0
answer_prompt = "Answer only from the supplied context. If the context is insufficient, say so clearly. Cite source chunk identifiers in square brackets when possible."

[provider]
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
generator_model = "openai/gpt-oss-120b"
embedding_model = "nvidia/nemotron-3-embed-1b"
embedding_dimension = 2048
embedding_timeout_seconds = 600
generator_request_timeout_seconds = 300
generator_worker_timeout_seconds = 600
request_max_attempts = 6
retry_backoff_seconds = 4.0
retry_max_delay_seconds = 60.0
judge_model = "openai/gpt-oss-120b"
region = "global"
pricing_date = "2026-08-02"
# Notional reference prices only; actual API expenditure is recorded separately as USD 0.
generator_input_per_million = 1.0
generator_output_per_million = 6.0
embedding_input_per_million = 0.02
judge_input_per_million = 2.5
judge_output_per_million = 15.0
requests_per_minute = 5

[datasets.graphrag_bench_medical_rq3_micro]
family = "graphrag_bench"
domain = "medical"
sample_size = 10
pilot_size = 3
source_url = "https://huggingface.co/datasets/GraphRAG-Bench/GraphRAG-Bench"
licence = "record during acquisition"

[systems.naive]
kind = "native"

[systems.graphrag]
kind = "command"
index_checkpoint = "corpus"
index_command = ".venv/bin/python scripts/graphrag_bridge.py index --config config/rq3_medical_micro.toml --workspace {workspace} --input {input} --output {output}"
query_command = ".venv/bin/python scripts/graphrag_bridge.py query --config config/rq3_medical_micro.toml --workspace {workspace} --question {question} --method {method} --output {output}"

[systems.lightrag]
kind = "command"
index_checkpoint = "corpus"
enable_llm_cache = true
enable_llm_cache_for_entity_extract = true
enable_embedding_cache = true
index_command = ".venv/bin/python scripts/lightrag_bridge.py index --config config/rq3_medical_micro.toml --workspace {workspace} --input {input} --output {output} {incremental_flag}"
query_command = ".venv/bin/python scripts/lightrag_bridge.py query --config config/rq3_medical_micro.toml --workspace {workspace} --question {question} --method {method} --output {output}"
